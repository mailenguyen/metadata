server:
  address: 0.0.0.0
  port: ${PORT}

spring:
  application:
    name: metadata-service

  data:
    redis:
      url: ${REDIS_URL}

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

security:
  jwt:
    public-key: ${JWT_PUBLIC_KEY}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE}
    fetch-registry: true
    register-with-eureka: true

  instance:
    hostname: ${RENDER_EXTERNAL_HOSTNAME:localhost}
    secure-port-enabled: true
    instance-id: ${spring.application.name}:${RENDER_EXTERNAL_HOSTNAME:localhost}

metadata:
  key:
    pattern: ${METADATA_KEY_PATTERN}