server:
  address: 0.0.0.0
  port: ${PORT:8763}

spring:
  data:
    redis:
      url: ${REDIS_URL}

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

security:
  jwt:
    public-key: ${JWT_PUBLIC_KEY}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE}

metadata:
  key:
    pattern: ${METADATA_KEY_PATTERN}